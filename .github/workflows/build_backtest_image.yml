# Auto-rebuild + push the archondex-backtest:dev image to ECR on every
# main-branch push that touches code the image bakes in.
#
# Purpose: the Dockerfile.backtest bakes project source + data/processed +
# governor templates at build time. If the image isn't kept in sync with
# main, every cloud campaign risks running stale code (e.g., the May-9
# image missing T-054 ticker= fix, T-055/T-055d vol-target, etc.).
#
# This workflow keeps :dev within minutes of main HEAD.
#
# Prerequisite secrets (configure in repo settings → Secrets → Actions):
#   AWS_ROLE_TO_ASSUME — ARN of an IAM role with ECR push permissions for
#                        archondex-backtest. Federated via OIDC (no
#                        long-lived access keys in CI).
#
# Manual fallback path is documented in docs/Cloud/CLOUD_USAGE.md →
# "Refreshing the image" → "Manual".

name: Build & push backtest image

on:
  push:
    branches: [main]
    paths:
      # The image bakes these → rebuild when they change.
      - "Dockerfile.backtest"
      - "requirements.lock.txt"
      - "scripts/cloud_entrypoint.sh"
      - "scripts/run_isolated.py"
      - "core/**"
      - "engines/**"
      - "data/processed/**"
      - "data/governor/_isolated_anchor/**"
      - ".github/workflows/build_backtest_image.yml"
  # Manual trigger for "I need this rebuilt right now" cases.
  workflow_dispatch:

# Concurrency: cancel any in-flight build when a newer commit arrives.
# Each main push only needs the latest image.
concurrency:
  group: build-backtest-image
  cancel-in-progress: true

permissions:
  # Required for the OIDC federation to AWS.
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 407539788432.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: archondex-backtest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # T-2026-06-05-109 fail-loud precheck. The OIDC action below silently
      # reports "Credentials could not be loaded" when AWS_ROLE_TO_ASSUME
      # is missing, which T-109 traced to ~10 consecutive failed runs
      # since 2026-05-24 (the secret has never been configured for this
      # repo). Fail with a NAMED reason so the next maintainer doesn't
      # have to dig through the OIDC action output.
      # See docs/Audit/ecr_rebuild_static20_t109_2026_06_05.md for the
      # one-time IAM + secret setup the user must do.
      - name: Pre-check required secrets
        run: |
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "::error::Repo secret AWS_ROLE_TO_ASSUME is MISSING."
            echo "::error::This workflow has been failing on every main push since 2026-05-24."
            echo "::error::Fix: GitHub repo → Settings → Secrets and variables → Actions →"
            echo "::error::      add secret AWS_ROLE_TO_ASSUME with the IAM role ARN."
            echo "::error::See docs/Audit/ecr_rebuild_static20_t109_2026_06_05.md for the"
            echo "::error::IAM role + OIDC trust-policy configuration (one-time setup)."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (for layer cache)
        uses: docker/setup-buildx-action@v3

      # T-2026-06-11-155: the data substrate is gitignored — the runner
      # checkout has no data/. Fetch the manifest-pinned, content-addressed
      # snapshot from S3 (the prefix IS the manifest md5 committed at this
      # ref, so code and data are pinned to each other by construction).
      - name: Fetch pinned substrate from S3
        run: |
          MD5=$(md5sum config/substrate_manifest.sha256 | awk '{print $1}')
          echo "substrate manifest md5: $MD5"
          aws s3 sync "s3://archondex-results-407539788432/substrate/$MD5/data" data \
            --region us-east-1 --no-progress --only-show-errors
          # live governor files are manifest-excluded but the harness
          # restore path expects the anchor; nothing else needed.

      # T-155: build through the SANCTIONED script (git archive staging +
      # manifest verify + provenance labels + registry-direct push) — the
      # same path as local builds; raw docker build is deprecated.
      - name: Build + push via build_backtest_image.sh (registry-direct)
        run: |
          SHORT=$(git rev-parse --short HEAD)
          ARCHONDEX_BUILD_PUSH=1 bash scripts/build_backtest_image.sh HEAD \
            "$ECR_REGISTRY/$ECR_REPOSITORY:sha-$SHORT"

      - name: Summary
        run: |
          echo "::notice title=Image pushed::Image ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:dev and :sha-${{ github.sha }} pushed to ECR. Next cloud campaign will use this image."
