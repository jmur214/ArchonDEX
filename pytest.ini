[pytest]
# Test tiers (2026-08-27). The DEFAULT local run is the fast tier; the `slow` tier
# is excluded from it and runs nightly under the Phase-6 janitor, which is the
# consumer this tier exists for.
#
#   default (fast):  .venv/bin/python -m pytest
#   full (nightly):  .venv/bin/python -m pytest -m ""      # everything
#   slow only:       .venv/bin/python -m pytest -m slow
#
# WHAT MAY BE MARKED slow: expensive replays and explicit PERFORMANCE tests whose
# value is unchanged by running once a night.
# WHAT MAY NOT: determinism pins, census/contract gates, and anything in the
# measurement path. A determinism regression that waits until the next nightly is
# a measurement-integrity gap, and the seconds saved do not buy it back.
markers =
    slow: expensive; excluded from the default run, executed by the nightly janitor
addopts = -m "not slow"
# Collect ONLY tests/ (2026-10-14). A bare `pytest` otherwise walks data/, and in every
# agent worktree data/{logs,trade_logs,processed,research,observability} are SYMLINKS
# into main's data/ — one stray test_*.py there (a stash-accident dir held one) aborts
# the whole suite at collection. scripts/janitor_nightly.py FAST_SUITE names "tests"
# too, so the nightly invocation stays safe even if this line is edited alone.
testpaths = tests
